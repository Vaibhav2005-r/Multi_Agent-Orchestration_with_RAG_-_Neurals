models:
  - type: main
    engine: nim
    model: meta/llama-3.1-8b-instruct

rails:
  config:
    gliner:
      server_endpoint: https://integrate.api.nvidia.com/v1/chat/completions
      api_key_env_var: NVIDIA_API_KEY
      threshold: 0.5
      input:
        entities:
          - EMAIL
          - PHONE_NUMBER
          - SSN
          - CREDIT_CARD
          - LOCATION
          - PERSON
          - ORGANIZATION
          - IP_ADDRESS
          - DATE_OF_BIRTH
          - DRIVER_LICENSE
          - PASSPORT
          - IBAN_CODE
          - US_BANK_NUMBER
          - CRYPTO
          - PASSWORD
          - USERNAME
          - MEDICAL_LICENSE
          - STREET_ADDRESS

  input:
    flows:
      - gliner detect pii on input
